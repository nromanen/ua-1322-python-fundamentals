{% extends "base.html" %}
{% block content %}
<h1>Редагувати товар</h1>
<form method="post">
  <div class="mb-3">
    <label for="name" class="form-label">Назва товару</label>
    <input type="text" class="form-control" name="name" id="name" value="{{ product.name }}" required>
  </div>
  <div class="mb-3">
    <label for="description" class="form-label">Опис</label>
    <textarea class="form-control" name="description" id="description">{{ product.description }}</textarea>
  </div>
  <div class="mb-3">
    <label for="price" class="form-label">Ціна</label>
    <input type="number" step="0.01" class="form-control" name="price" id="price" value="{{ product.price }}" required>
  </div>
  <div class="mb-3">
    <label for="category_id" class="form-label">Категорія</label>
    <select name="category_id" id="category_id" class="form-select" required>
      {% for category in categories %}
      <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Оновити товар</button>
</form>
{% endblock %}
