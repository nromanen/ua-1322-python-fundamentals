{% extends "base.html" %}
{% block content %}
<h1>Категорії</h1>
<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Назва</th>
      <th>Дії</th>
    </tr>
  </thead>
  <tbody>
    {% for category in categories %}
    <tr>
      <td>{{ category.id }}</td>
      <td>{{ category.name }}</td>
      <td>
        <a href="{{ url_for('edit_category', category_id=category.id) }}" class="btn btn-secondary btn-sm">Редагувати</a>
        <form method="post" action="{{ url_for('delete_category', category_id=category.id) }}" style="display:inline-block;">
          <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Ви впевнені, що хочете видалити цю категорію?');">Видалити</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
